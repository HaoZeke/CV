name: Build CVs
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          cache: true

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-bibtex-extra texlive-latex-extra \
            texlive-fonts-extra texlive-fonts-recommended \
            biber latexmk fonts-font-awesome

      - name: Build all CV variants
        run: pixi run all

      - name: Collect PDFs
        run: |
          mkdir -p artifacts
          cp curriculum-vitae/literate_cv.pdf artifacts/RG_CV_Full.pdf
          cp twoPage/literate_twopage.pdf artifacts/RG_CV_TwoPage.pdf
          cp onePage/literate_onepage.pdf artifacts/RG_CV_OnePage.pdf

      - name: Push to pdfs branch
        run: |
          cd artifacts
          git init
          git checkout --orphan pdfs
          git add *.pdf
          git -c user.name="github-actions" -c user.email="actions@github.com" \
            commit -m "Update CV PDFs ($(date -u +%Y-%m-%d))"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin pdfs
