name: Build CVs
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-cvs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          cache: true

      - uses: zauguin/install-texlive@v3
        with:
          packages: >
            scheme-basic
            xetex latexmk biber
            academicons arydshln babel babel-english biblatex
            biblatex-publist capt-of colortbl csquotes enumitem
            etoolbox fancyhdr fontawesome5 fontspec geometry
            gettitlestring graphics graphics-cfg graphics-def
            greek-fontenc hyperref isodate kvdefinekeys kvoptions
            kvsetkeys l3backend l3kernel l3packages metalogo
            microtype moderncv multirow pgf realscripts
            substr textpos tipa titlesec ulem unicode-data
            wrapfig xcolor xltxtra xunicode
            lm lm-math collection-fontsrecommended
            fontawesome6

      - name: Build all CV variants
        run: pixi run all

      - name: Guard title leak and onepage length
        run: |
          if rg -n 'literate master' build/full/cv.tex cv.org; then
            echo "internal TITLE leaked into export or source" >&2
            exit 1
          fi
          if ! rg -q 'Output written on cv.pdf \(1 page' build/onepage/cv.log; then
            echo "onepage CV is not one page" >&2
            rg 'Output written on cv.pdf' build/onepage/cv.log || true
            exit 1
          fi

      - name: Collect PDFs
        run: |
          mkdir -p artifacts
          cp build/full/cv.pdf artifacts/RG_CV_Full.pdf
          cp build/twopage/cv.pdf artifacts/RG_CV_TwoPage.pdf
          cp build/onepage/cv.pdf artifacts/RG_CV_OnePage.pdf
          cp build/grant/cv.pdf artifacts/RG_CV_Grant3Page.pdf

      - name: Push to pdfs branch
        run: |
          cd artifacts
          git init
          git checkout --orphan pdfs
          git add *.pdf
          git -c user.name="github-actions" -c user.email="actions@github.com" \
            commit -m "Update CV PDFs ($(date -u +%Y-%m-%d))"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin pdfs
